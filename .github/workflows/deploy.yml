name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # ------------------------------------------------------------------------

      - name: Build docs
        run: |
          just build

      - name: Cache website
        id: cache-build
        uses: actions/cache@v6
        with:
          path: dist
          key: >
            website
            ${{ github.run_id }}
            ${{ github.run_attempt }}

  cf-workers:
    uses: ./.github/workflows/deploy-cloudflare.yml
    needs: [build]
    secrets: inherit

  post-deploy:
    uses: ./.github/workflows/purge-cloudflare-cache.yml
    needs: [cf-workers]
    secrets: inherit
